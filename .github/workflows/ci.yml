name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  docker-smoke:
    name: docker-smoke
    needs: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime dependencies for CI smoke artifact
        run: pip install -e .

      - name: Create CI smoke artifact
        run: python scripts/create_ci_smoke_artifact.py

      - name: Confirm CI smoke artifact files
        run: |
          test -f artifacts/xgb-transformed-v1/model.joblib
          test -f artifacts/xgb-transformed-v1/calibrator.joblib
          test -f artifacts/xgb-transformed-v1/metadata.json
          python -c "
          import json
          from pathlib import Path
          meta = json.loads(Path('artifacts/xgb-transformed-v1/metadata.json').read_text())
          assert meta['model_version'] == 'ci-smoke-v1', meta
          print('CI smoke metadata model_version=', meta['model_version'])
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally, do not push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fraud-risk-api:ci

      - name: Run container
        run: |
          set -euo pipefail
          docker run -d --name fraud-risk-api-ci -p 8000:8000 fraud-risk-api:ci
          # Confirm the container did not exit immediately after start.
          sleep 1
          if [ "$(docker inspect -f '{{.State.Running}}' fraud-risk-api-ci)" != "true" ]; then
            echo "ERROR: container fraud-risk-api-ci is not running after docker run" >&2
            docker ps -a || true
            docker inspect fraud-risk-api-ci || true
            docker logs fraud-risk-api-ci || true
            exit 1
          fi
          echo "container running"

      - name: Wait for Docker health
        run: |
          set -euo pipefail
          # HEALTHCHECK interval is 30s; allow enough polls for starting -> healthy.
          max_attempts=60
          for attempt in $(seq 1 "${max_attempts}"); do
            if [ "$(docker inspect -f '{{.State.Running}}' fraud-risk-api-ci)" != "true" ]; then
              echo "ERROR: container stopped/exited while waiting for healthy (attempt ${attempt})" >&2
              echo "--- docker ps -a ---"
              docker ps -a || true
              echo "--- health status ---"
              docker inspect --format='{{.State.Health.Status}}' fraud-risk-api-ci || true
              echo "--- docker inspect ---"
              docker inspect fraud-risk-api-ci || true
              echo "--- docker logs ---"
              docker logs fraud-risk-api-ci || true
              exit 1
            fi

            health_status="$(docker inspect --format='{{.State.Health.Status}}' fraud-risk-api-ci)"
            echo "health attempt ${attempt}/${max_attempts}: ${health_status}"
            case "${health_status}" in
              healthy)
                echo "Docker health status is healthy"
                exit 0
                ;;
              unhealthy)
                echo "ERROR: Docker health status is unhealthy" >&2
                echo "--- docker ps -a ---"
                docker ps -a || true
                echo "--- health status ---"
                echo "${health_status}"
                echo "--- docker inspect ---"
                docker inspect fraud-risk-api-ci || true
                echo "--- docker logs ---"
                docker logs fraud-risk-api-ci || true
                exit 1
                ;;
              starting|"")
                sleep 1
                ;;
              *)
                echo "WARNING: unexpected health status '${health_status}'; continuing to poll" >&2
                sleep 1
                ;;
            esac
          done

          echo "ERROR: timed out waiting for Docker healthy after ${max_attempts}s" >&2
          echo "--- docker ps -a ---"
          docker ps -a || true
          echo "--- health status ---"
          docker inspect --format='{{.State.Health.Status}}' fraud-risk-api-ci || true
          echo "--- docker inspect ---"
          docker inspect fraud-risk-api-ci || true
          echo "--- docker logs ---"
          docker logs fraud-risk-api-ci || true
          exit 1

      - name: HTTP smoke assertions
        run: python scripts/ci_http_smoke.py --base-url http://127.0.0.1:8000

      - name: Container diagnostics and cleanup
        if: always()
        run: |
          set +e
          echo "--- docker ps -a ---"
          docker ps -a
          echo "--- health status ---"
          docker inspect --format='{{.State.Health.Status}}' fraud-risk-api-ci
          echo "--- docker inspect ---"
          docker inspect fraud-risk-api-ci
          echo "--- docker logs ---"
          docker logs fraud-risk-api-ci
          docker rm -f fraud-risk-api-ci || true
          # Diagnostics must not mask the original failing step.
          exit 0
